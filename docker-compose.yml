services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-hr
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: OracleSys_2026
      APP_USER: hr
      APP_USER_PASSWORD: HrUser_2026
      ORACLE_DATABASE: XEPDB1
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./init-scripts:/container-entrypoint-initdb.d
      - ./start-scripts:/container-entrypoint-startdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  oracle_data:
